<!-- calendar.component.html -->
<div class="calendar-container">
  <!-- Left Calendar -->
  <div class="calendar-left">
    <div class="calendar-grid">
      <div
        *ngFor="let day of daysInMonth"
        class="day"
        [ngClass]="{ marked: isMarked(day.date) }"
        (click)="onDateClick(day.date)">
        {{ day.day }}
      </div>
    </div>
  </div>

  <!-- Right Side -->
  <div class="calendar-right">
    <ng-container *ngIf="selectedSessions.length > 0">
      <h3>Sessions on {{ selectedDate }}</h3>
      <div *ngFor="let session of selectedSessions" class="session-card">
        <p><strong>Time:</strong> {{ session.time }}</p>
        <p><strong>Batch:</strong> {{ session.batchid }}</p>
        <p><strong>Trainer:</strong> {{ session.trainerid }}</p>
        <p><strong>Topic:</strong> {{ session.topic }}</p>
        <p><strong>Duration:</strong> {{ session.duration }} hour(s)</p>
      </div>
    </ng-container>

    <!-- Modal Form Card -->
    <ng-container *ngIf="selectedSessions.length === 0 && selectedDate">
      <div class="modal-overlay">
        <div class="modal-card">
          <h3>Add Session for {{ selectedDate }}</h3>
          <form [formGroup]="sessionForm" (ngSubmit)="saveSession()">
            <label>Time:
              <input type="time" formControlName="time" required />
            </label>
            <label>Batch No:
              <input type="text" formControlName="batchid" required />
            </label>
            <label>Trainer ID:
              <input type="number" formControlName="trainerid" required />
            </label>
            <label>Topic:
              <input type="text" formControlName="topic" required />
            </label>
            <label>Duration (hrs):
              <input type="number" formControlName="duration" required />
            </label>
            <div class="modal-actions">
              <button type="button" class="cancel-btn" (click)="selectedDate=''">Cancel</button>
              <button type="submit" [disabled]="sessionForm.invalid" class="save-btn">Save</button>
            </div>
          </form>
        </div>
      </div>
    </ng-container>
  </div>
</div>
