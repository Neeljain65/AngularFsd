<div class="p-8">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">👋 Hello, {{ student.name }}</h1>
  
    <!-- Student Details Card -->
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-200 max-w-xl">
      <h2 class="text-2xl font-semibold mb-6 text-gray-700">🎓 Student Profile</h2>
  
      <div class="space-y-4 text-gray-600">
        <div>
          <span class="font-medium text-gray-800">ID:</span>
          <span class="ml-2 text-gray-700">{{ student.studentid }}</span>
        </div>
  
        <div>
          <span class="font-medium text-gray-800">Name:</span>
          <span class="ml-2 text-gray-700">{{ student.name }}</span>
        </div>
  
        <div>
          <span class="font-medium text-gray-800">Email:</span>
          <span class="ml-2 text-blue-600 underline">{{ student.email }}</span>
        </div>
  
        <div>
          <span class="font-medium text-gray-800">Field:</span>
          <span class="ml-2 inline-block bg-blue-100 text-blue-800 text-sm px-3 py-1 rounded-full">
            {{ student.feild }}
          </span>
        </div>
  
        <div>
          <span class="font-medium text-gray-800">Age:</span>
          <span class="ml-2 text-gray-700">{{ student.age }}</span>
        </div>
  
        
  
        <div>
          <span class="font-medium text-gray-800">Batch:</span>
          <span class="ml-2 text-gray-700">{{ student.batchid }}</span>
        </div>
      </div>
    </div>
  </div>
